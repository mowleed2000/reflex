<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Reflex Interiors & Construction</title>
    <meta name="description" content="View the luxury retail, leisure and commercial interior fit-out portfolio of Reflex Interiors & Construction.">
    <link rel="stylesheet" href="styles.css?v=5">
    <style>
        .page-header {
            padding: 12rem 5% 4rem;
            text-align: center;
        }
        
        .page-title {
            margin-bottom: 2rem;
            font-size: clamp(3rem, 6vw, 5rem);
        }
        
        .portfolio-grid {
            columns: 1;
            column-gap: 2rem;
            padding-bottom: 8rem;
        }
        
        @media (min-width: 600px) {
            .portfolio-grid {
                columns: 2;
            }
        }
        
        @media (min-width: 992px) {
            .portfolio-grid {
                columns: 3;
            }
        }
        
        .portfolio-item {
            break-inside: avoid;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            display: block;
        }
        
        .portfolio-item::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid transparent;
            transition: border-color var(--transition-fast);
            pointer-events: none;
        }
        
        .portfolio-item:hover::after {
            border-color: rgba(184, 150, 106, 0.5); /* Gold border reveal */
        }
        
        .portfolio-item img {
            width: 100%;
            height: auto;
            aspect-ratio: 3/2;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform var(--transition-smooth);
            will-change: transform;
        }
        
        .portfolio-item:hover img {
            transform: scale(1.02);
        }

        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: all;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: zoom-in;
        }

        .lightbox.active img {
            transform: scale(1);
        }

        .lightbox.active img.zoomed {
            transform: scale(2);
            cursor: zoom-out;
        }

        .lightbox-close {
            position: absolute;
            top: 2rem;
            right: 3rem;
            color: white;
            font-size: 3rem;
            cursor: pointer;
            font-weight: 300;
            line-height: 1;
            transition: color 0.3s;
        }

        .lightbox-close:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <img src="assets/Reflex_Logo_HighRes.jpg" alt="Reflex Logo">
        </a>
        
        <button class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="portfolio.html" class="active">Portfolio</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <header class="page-header container reveal">
        <h1 class="page-title">Our Work</h1>
    </header>

    <main class="container portfolio-grid">
        <!-- 50 Portfolio Items -->
        <script>
            function openLightbox(imgElement) {
                const highResSrc = imgElement.getAttribute('data-high-res');
                const lightbox = document.getElementById('lightbox');
                const lightboxImg = document.getElementById('lightbox-img');
                
                // Set high-res source
                lightboxImg.src = highResSrc;
                lightboxImg.classList.remove('zoomed');
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox(event) {
                // If they clicked the image, let the image's own click handler deal with zoom
                if (event && event.target.id === 'lightbox-img') return;
                
                const lightbox = document.getElementById('lightbox');
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
                
                // Clear src to save memory when closed
                document.getElementById('lightbox-img').src = '';
            }

            function toggleZoom(event) {
                event.stopPropagation();
                const img = document.getElementById('lightbox-img');
                img.classList.toggle('zoomed');
            }

            // Generating the 50 images dynamically for cleaner HTML
            const grid = document.querySelector('.portfolio-grid');
            let imagesHTML = '';
            for (let i = 1; i <= 50; i++) {
                imagesHTML += `
                    <div class="portfolio-item reveal">
                        <img src="assets/thumbs/Thumb_${i}.jpg" 
                             data-high-res="assets/high_res/Commercial_${i}.jpg" 
                             alt="Reflex Portfolio Image ${i}" 
                             loading="lazy" 
                             onclick="openLightbox(this)">
                    </div>
                `;
            }
            grid.innerHTML = imagesHTML;
        </script>
    </main>

    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Portfolio Image" onclick="toggleZoom(event)">
    </div>

    <footer>
        <div class="footer-content container">
            <a href="index.html" class="footer-logo">
                <img src="assets/Reflex_Logo_HighRes.jpg" alt="Reflex Logo">
            </a>
            <div class="footer-copy">
                &copy; 2026 Reflex Interiors & Construction. All rights reserved.
            </div>
            <div class="footer-contact">
                <a href="mailto:enquiries@reflex4.co.uk">enquiries@reflex4.co.uk</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
