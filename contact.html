<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Reflex Interiors & Construction</title>
    <meta name="description" content="Get in touch with Reflex Interiors & Construction in London.">
    <link rel="stylesheet" href="styles.css?v=6">
    <style>
        .contact-layout {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 100vh;
        }
        
        @media (min-width: 992px) {
            .contact-layout {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .contact-content {
            padding: 12rem 10% 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        @media (min-width: 992px) {
            .contact-content {
                padding: 12rem 15% 4rem;
            }
        }
        
        .page-title {
            margin-bottom: 4rem;
        }
        
        .contact-details {
            font-family: var(--font-body);
            font-size: 1.1rem;
            letter-spacing: 0.05em;
        }
        
        .contact-group {
            margin-bottom: 2.5rem;
            padding-bottom: 2.5rem;
            border-bottom: 1px solid rgba(184, 150, 106, 0.2); /* Fine gold rule */
        }
        
        .contact-group:last-child {
            border-bottom: none;
        }
        
        .contact-label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent-color);
            margin-bottom: 0.8rem;
        }
        
        .contact-value {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            color: var(--text-color);
            line-height: 1.4;
        }
        
        .contact-value a {
            transition: color var(--transition-fast);
        }
        
        .contact-value a:hover {
            color: var(--accent-color);
        }
        
        .contact-visual {
            position: relative;
            height: 50vh;
            overflow: hidden;
        }
        
        @media (min-width: 992px) {
            .contact-visual {
                height: 100%;
            }
        }
        
        .contact-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.8);
        }
        
        /* Adjust footer for contact page */
        .contact-page-footer {
            margin-top: 0;
            border-top: none;
            background-color: var(--bg-color);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <img src="assets/Reflex_Logo_HighRes.jpg" alt="Reflex Logo">
        </a>
        
        <button class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <main class="contact-layout">
        <div class="contact-content">
            <h1 class="page-title reveal">Get In Touch</h1>
            
            <div class="contact-details">
                <div class="contact-group reveal stagger-1">
                    <span class="contact-label">Head Office</span>
                    <div class="contact-value">
                        Reflex Interiors & Construction<br>
                        Unit 4, 12 Greenock Road<br>
                        London, W3 8DU
                    </div>
                </div>
                
                <div class="contact-group reveal stagger-2">
                    <span class="contact-label">Telephone</span>
                    <div class="contact-value">
                        <a href="tel:+442089927797">+44 (0)208 992 7797</a>
                    </div>
                </div>
                
                <div class="contact-group reveal stagger-3">
                    <span class="contact-label">Email</span>
                    <div class="contact-value">
                        <a href="mailto:enquiries@reflex4.co.uk">enquiries@reflex4.co.uk</a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="contact-visual reveal">
            <img src="assets/high_res/Commercial_1.jpg" alt="Reflex Construction Work">
        </div>
    </main>

    <footer class="contact-page-footer">
        <div class="footer-content container">
            <a href="index.html" class="footer-logo">
                <img src="assets/Reflex_Logo_HighRes.jpg" alt="Reflex Logo">
            </a>
            <div class="footer-copy">
                &copy; 2026 Reflex Interiors & Construction. All rights reserved.
            </div>
            <div class="footer-contact">
                <a href="mailto:enquiries@reflex4.co.uk">enquiries@reflex4.co.uk</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
